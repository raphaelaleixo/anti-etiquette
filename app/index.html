<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Anti-Étiquette</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS does not accept SVG here — it silently falls back to a screenshot
         of the page. PNG only. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wine" />
    <!-- Tints the phone browser's chrome to match the app ground, so the
         status bar doesn't sit as a pale band above the espresso page. -->
    <meta name="theme-color" content="#15120f" />
    <meta name="description" content="Find a wine you'll like at your SAQ branch. Runs entirely in your browser." />
  </head>
  <body>
    <!--
      The shell is static markup, not JS-generated: it is the same on every
      load, so building it at runtime would only add a frame of empty page.
      The custom elements below upgrade in place once the module runs.
    -->
    <main class="shell">
      <h1 class="visually-hidden">Anti-Étiquette — wine at the SAQ</h1>

      <!--
        One bar carrying identity, place and language: the mark, the wordmark,
        the two sections, and the switches that apply everywhere.
      -->
      <header class="topbar">
        <div class="topbar-left">
          <span class="brand">
            <span class="mark" aria-hidden="true"></span>
            <span class="wordmark">Anti-Étiquette</span>
          </span>
          <mode-switch></mode-switch>
        </div>
        <div class="topbar-right">
          <!--
            `?stay` suppresses the landing page's returning-visitor redirect.
            Without it this link would bounce straight back here, since having
            a saved list is exactly what triggers that redirect.
          -->
          <a class="topbar-link" href="/?stay#about">About this project</a>
          <lang-toggle></lang-toggle>
        </div>
      </header>

      <app-head></app-head>
      <app-status></app-status>

      <div class="shell-body">
        <app-panel></app-panel>
      </div>

      <div class="shell-fade" aria-hidden="true"></div>
      <div class="shell-foot">
        <app-foot></app-foot>
      </div>
    </main>

    <noscript>
      This tool runs entirely in your browser, so it needs JavaScript. Nothing
      you save here is sent anywhere.
    </noscript>

    <script type="module" src="/src/ui/shell.ts"></script>
  </body>
</html>
